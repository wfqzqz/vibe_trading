# ---------------------------------------------------------------------------
# Service topology (DORA-124 §1.2, "agent + web + factor-runtime"):
#   * `vibe-trading` below is the agent (FastAPI) and ALSO the factor-runtime
#     host — the py-alpha-lib factor runtime (DORA-144 / F-01) is an IN-PROCESS
#     module of the agent, not a separate service (DORA-124 rev v1.1 附带澄清 1).
#     py-alpha-lib==0.3.0 is baked into this image by the Dockerfile, so the
#     runtime is fully functional inside the container only.
#   * `frontend` (profile-gated) is the dev Web server; the production image
#     serves frontend/dist itself.
# No `factor-runtime` service is declared on purpose: it is not a microservice.
# ---------------------------------------------------------------------------
services:
  vibe-trading:
    build:
      context: .
      # Docker Desktop injects HTTP(S)_PROXY build args pointing at
      # http.docker.internal:3128; that proxy intermittently fails for PyPI
      # ("Could not find a version ... (from versions: none)" on random
      # packages, e.g. python-telegram-bot / pycryptodome; direct PyPI access
      # works fine). Pin empty proxy args so image builds hit PyPI directly
      # (DORA-251 follow-up). If your network needs a proxy for PyPI, override
      # with `docker compose build --build-arg HTTP_PROXY=<url> ...`.
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        ALL_PROXY: ""
    ports:
      # Host bind port is .env-driven (root .env VIBE_WEB_PORT); the container
      # side stays 8899 — the fixed EXPOSE/CMD contract of the image.
      - "127.0.0.1:${VIBE_WEB_PORT:-8899}:8899"
    env_file:
      - agent/.env
    environment:
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1
      - VIBE_TW_STOCK_DB=/data/tw-stock/latest.db
      # A-share miniQMT loader cache (DORA-124 §1.2 / P-03). The QMT Bridge on
      # the Windows host writes ~/.vibe-trading/cache/loaders/miniqmt/; this
      # container reads it at the same default loader-cache root (see the bind
      # mount below). The opt-in cache is ON by default so the miniqmt loader
      # serves the bridge's settled bars instead of falling through to free
      # sources on every request.
      - VIBE_TRADING_DATA_CACHE=${VIBE_TRADING_DATA_CACHE:-1}
      - VIBE_TRADING_DATA_CACHE_ROOT=/home/vibe/.vibe-trading/cache/loaders
      # Optional cold-read back to the QMT Bridge via the host gateway. The
      # bridge binds 127.0.0.1 by default, so a container cold read only works
      # when the bridge is also listening on the gateway (run it with
      # QMT_BRIDGE_HOST=0.0.0.0 or the LAN IP) — the shared cache above is the
      # primary path and needs no such change. QMT_BRIDGE_TOKEN is the loopback
      # bearer token (empty = cache-only reads, cold read degrades).
      - QMT_BRIDGE_HOST=${QMT_BRIDGE_HOST:-host.docker.internal}
      - QMT_BRIDGE_PORT=${QMT_BRIDGE_PORT:-8100}
      - QMT_BRIDGE_TOKEN=${QMT_BRIDGE_TOKEN:-}
      # Ollama runs on the host; from inside the container "localhost" is the
      # container itself, so default to reaching the host via host.docker.internal.
      # Override by exporting OLLAMA_BASE_URL (or setting it in a top-level .env)
      # when Ollama runs elsewhere or on a different port.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Maps host.docker.internal -> host gateway (needed on Linux; harmless on Docker Desktop).
      # Requires Docker Engine >= 20.10 / Compose v2 (host-gateway support).
      - "host.docker.internal:host-gateway"
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      # User-level agent state: persistent memory, cross-session search index
      # (sessions.db), user-created skills, shadow accounts, hypothesis
      # registry, broker connector config, agent.json. Without this volume a
      # rebuild/recreate wipes it all (#197).
      - vibe-home:/home/vibe/.vibe-trading
      - vibe-swarm-runs:/app/agent/.swarm/runs
      - vibe-uploads:/app/agent/uploads
      # Persist Web-UI-driven agent/.env edits (_write_env_values in
      # src/api/helpers.py writes to /app/agent/.env) across container recreation.
      # env_file above still seeds the initial boot env from the same file.
      - ./agent/.env:/app/agent/.env
      # Published Taiwan stock snapshots, mounted read-only. The default host
      # path stays OUTSIDE the checkout: no market data may ever land in the
      # working tree. Compose does not expand "~" in volume paths, so this uses
      # USERPROFILE (Windows) with a HOME fallback (Linux/macOS). Override
      # VIBE_TW_STOCK_DATA_DIR in the root .env with another absolute path
      # outside the repo.
      - ${VIBE_TW_STOCK_DATA_DIR:-${USERPROFILE:-${HOME}}/.vibe-trading/tw-stock}:/data/tw-stock:ro
      # Shared A-share loader cache (DORA-124 §1.2 / P-03): the QMT Bridge
      # writes ~/.vibe-trading/cache/loaders/miniqmt/ on the Windows host, and
      # the local Windows agent and this container read the SAME directory.
      # Compose does not expand "~"; the default host side uses USERPROFILE
      # (Windows) with a HOME fallback (Linux/macOS). Override
      # VIBE_TRADING_DATA_CACHE_ROOT in the root .env to relocate the host side.
      # Mounted rw (not ro) so a container cold read can also cache its result
      # under the same content-addressed keys the bridge writes.
      - ${VIBE_TRADING_DATA_CACHE_ROOT:-${USERPROFILE:-${HOME}}/.vibe-trading/cache/loaders}:/home/vibe/.vibe-trading/cache/loaders
    # --- Runtime hardening (VT-007) ---
    cap_drop:
      - ALL
    # SETUID/SETGID are kept on purpose: runner.py drops privilege to the
    # unprivileged vibe-sandbox user for LLM-generated-code subprocesses, which
    # needs setuid/setgid. They are granted from container start (not gained via
    # escalation), so no-new-privileges below does not neutralize them.
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    # Writable scratch on the read-only rootfs. Named volumes above already
    # cover agent/runs, agent/sessions, agent/uploads, agent/.swarm/runs and
    # /home/vibe/.vibe-trading; these tmpfs mounts cover /tmp and the cache dirs
    # matplotlib/fontconfig write to during PDF rendering.
    tmpfs:
      - /tmp
      - /home/vibe/.cache
      - /home/vibe/.config
    # Bound a single runaway backtest. Generous self-hosted defaults; override
    # in a compose override file for constrained hosts.
    mem_limit: 4g
    cpus: 2
    pids_limit: 512
    restart: unless-stopped

  frontend:
    image: node:22@sha256:5647be709086c696ff32edaaf1c70cd26d1da6ab2b39c32f3c7b4c4a31957e37  # node:22 digest resolved 2026-07-28
    working_dir: /app
    ports:
      # Host bind port is .env-driven (root .env VIBE_FRONTEND_PORT).
      - "127.0.0.1:${VIBE_FRONTEND_PORT:-5899}:5899"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://vibe-trading:8899
    command: sh -c "npm install && npm run dev -- --host --port 5899"
    profiles:
      - frontend
    depends_on:
      vibe-trading:
        condition: service_started

volumes:
  vibe-runs:
  vibe-sessions:
  vibe-home:
  vibe-swarm-runs:
  vibe-uploads:
